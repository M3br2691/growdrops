
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="GrowDrops - Small rewards. Big steps.">
    <title>GrowDrops | Small rewards. Big steps.</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #101b18;
            color: #f2f7f3;
            min-height: 100vh;
        }

        header {
            padding: 24px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #294137;
        }

        .logo {
            font-size: 26px;
            font-weight: bold;
            color: #80d69b;
        }

        .tagline {
            color: #b5c8bb;
            font-size: 14px;
        }

        main {
            max-width: 900px;
            margin: 90px auto;
            padding: 30px 24px;
            text-align: center;
        }

        .welcome {
            color: #80d69b;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: clamp(38px, 7vw, 64px);
            margin-bottom: 20px;
        }

        h1 span {
            color: #80d69b;
        }

        .intro {
            color: #b5c8bb;
            font-size: 18px;
            line-height: 1.7;
            max-width: 620px;
            margin: 0 auto 35px;
        }

        .notice {
            display: inline-block;
            border: 1px solid #42634f;
            background: #1a2b22;
            color: #bde8c8;
            padding: 14px 22px;
            border-radius: 8px;
            font-size: 14px;
        }

        footer {
            text-align: center;
            padding: 30px;
            color: #82988a;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">GrowDrops</div>
        <div class="tagline">Small rewards. Big steps.</div>
    </header>

    <main>
        <p class="welcome">Welcome to GrowDrops</p>

        <h1>Small rewards.<br><span>Big steps.</span></h1>

        <p class="intro">
            Discover a simple way to start your crypto journey.
            Every small step is part of something bigger.
        </p>

        <div class="notice">
            Our faucet is currently under development.
            Stay tuned!
        </div>
    </main>

    <footer>
        © 2026 GrowDrops. All rights reserved.
    </footer>

</body>
</html>
